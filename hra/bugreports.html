<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐛 Bug Reporty — Poslední přeživší</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  :root {
    --bg: #080b0f;
    --panel: #0e1318;
    --border: #1e2830;
    --accent: #ff4b1f;
    --green: #39ff14;
    --yellow: #ffd700;
    --blue: #00b4d8;
    --text: #b0bec5;
    --dim: #546e7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 0;
  }

  .wrap { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

  header {
    border-bottom: 2px solid var(--accent);
    padding-bottom: 1.5rem;
    margin-bottom: 2rem;
  }

  header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.2rem, 4vw, 2rem);
    color: var(--accent);
    text-shadow: 0 0 20px rgba(255,75,31,0.4);
    letter-spacing: 2px;
  }

  header p { color: var(--dim); font-size: 0.8rem; margin-top: 0.4rem; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 0.8rem;
    margin-bottom: 1.5rem;
  }

  .stat-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 0.6rem 1.2rem;
    font-size: 0.85rem;
  }

  .stat-box span { font-size: 1.2rem; font-weight: bold; display: block; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .filter-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 0.4rem 1rem;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    transition: all 0.15s;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: #fff;
  }

  .report {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--dim);
    padding: 1rem 1.2rem;
    margin-bottom: 0.8rem;
    transition: border-color 0.15s;
  }

  .report[data-status="new"] { border-left-color: var(--accent); }
  .report[data-status="in_progress"] { border-left-color: var(--yellow); }
  .report[data-status="resolved"] { border-left-color: var(--green); }
  .report[data-status="wont_fix"] { border-left-color: #444; }

  .report-head {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: 0.4rem; margin-bottom: 0.6rem; font-size: 0.8rem;
  }

  .status-badge {
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-weight: bold;
  }

  .s-new { background: rgba(255,75,31,0.15); color: var(--accent); border: 1px solid var(--accent); }
  .s-in_progress { background: rgba(255,215,0,0.1); color: var(--yellow); border: 1px solid var(--yellow); }
  .s-resolved { background: rgba(57,255,20,0.1); color: var(--green); border: 1px solid var(--green); }
  .s-wont_fix { background: rgba(100,100,100,0.1); color: #666; border: 1px solid #444; }

  .report-meta { color: var(--dim); font-size: 0.78rem; }

  .report-desc { color: #eceff1; margin: 0.5rem 0; line-height: 1.5; }

  .report-steps {
    background: rgba(0,0,0,0.3);
    border-left: 2px solid var(--dim);
    padding: 0.5rem 0.8rem;
    font-size: 0.82rem;
    color: var(--text);
    margin-top: 0.5rem;
    white-space: pre-wrap;
  }

  .comments { margin-top: 0.8rem; }

  .comment {
    border-left: 2px solid var(--border);
    padding: 0.4rem 0.8rem;
    margin-top: 0.4rem;
    font-size: 0.8rem;
  }

  .comment-author { color: var(--blue); }

  #loading {
    text-align: center;
    padding: 4rem;
    color: var(--dim);
    font-size: 0.9rem;
  }

  .dot-anim::after {
    content: '...';
    animation: dots 1.2s steps(3, end) infinite;
  }

  @keyframes dots {
    0%,20% { content: '.'; }
    40%,60% { content: '..'; }
    80%,100% { content: '...'; }
  }

  .empty { text-align: center; color: var(--dim); padding: 2rem; }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 0.4rem 1rem;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.8rem;
    float: right;
    transition: all 0.15s;
  }
  .refresh-btn:hover { border-color: var(--blue); color: var(--blue); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>☢ POSLEDNÍ PŘEŽIVŠÍ — BUG REPORTY</h1>
    <p id="last-updated">Načítám data z Firebase...</p>
  </header>

  <div class="stats" id="stats-row">
    <div class="stat-box"><span id="cnt-all">—</span>Celkem</div>
    <div class="stat-box"><span id="cnt-new" style="color:var(--accent)">—</span>🆕 Nové</div>
    <div class="stat-box"><span id="cnt-prog" style="color:var(--yellow)">—</span>🔧 Řeší se</div>
    <div class="stat-box"><span id="cnt-done" style="color:var(--green)">—</span>✅ Opraveno</div>
    <div class="stat-box"><span id="cnt-skip" style="color:#666">—</span>❌ Zamítnuto</div>
    <button class="refresh-btn" onclick="loadReports()">↺ Obnovit</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Vše</button>
    <button class="filter-btn" data-filter="new" onclick="setFilter('new',this)">🆕 Nové</button>
    <button class="filter-btn" data-filter="in_progress" onclick="setFilter('in_progress',this)">🔧 Řeší se</button>
    <button class="filter-btn" data-filter="resolved" onclick="setFilter('resolved',this)">✅ Opraveno</button>
    <button class="filter-btn" data-filter="wont_fix" onclick="setFilter('wont_fix',this)">❌ Zamítnuto</button>
  </div>

  <div id="loading"><span class="dot-anim">Připojuji Firebase</span></div>
  <div id="reports-list"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAnqRlz8iSsMTKa0PePTIvbPwncG1yj9RM",
  authDomain: "posledni-prezivsi.firebaseapp.com",
  databaseURL: "https://posledni-prezivsi-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "posledni-prezivsi"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allReports = [];
let currentFilter = 'all';

const catIcon = { gameplay:'🎮', ui:'🖥️', combat:'⚔️', quests:'📜', items:'🎒', skills:'⭐', online:'🌐', other:'❓' };
const statusLabel = { new:'🆕 Nový', in_progress:'🔧 Řeší se', resolved:'✅ Opraveno', wont_fix:'❌ Zamítnuto' };

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(ts) {
  if (!ts) return '?';
  return new Date(ts).toLocaleString('cs-CZ', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderReports();
}

function renderReports() {
  const list = document.getElementById('reports-list');
  const filtered = currentFilter === 'all' ? allReports : allReports.filter(r => (r.status||'new') === currentFilter);

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Žádná hlášení v této kategorii.</div>';
    return;
  }

  list.innerHTML = filtered.map(r => {
    const status = r.status || 'new';
    const comments = r.comments ? Object.values(r.comments).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)) : [];
    const commentsHtml = comments.map(c => `
      <div class="comment">
        <span class="comment-author">${esc(c.author||'?')}</span>
        <span style="color:var(--dim)"> · ${fmtDate(c.timestamp)}</span><br>
        ${esc(c.text||'')}
      </div>`).join('');

    return `<div class="report" data-status="${status}">
      <div class="report-head">
        <span class="status-badge s-${status}">${statusLabel[status]||status}</span>
        <span class="report-meta">
          ${catIcon[r.category]||'❓'} ${esc(r.category||'?')} &nbsp;·&nbsp;
          👤 ${esc(r.player||'?')} &nbsp;·&nbsp;
          🕐 ${fmtDate(r.timestamp)}
        </span>
      </div>
      <div class="report-desc">${esc(r.description||r.desc||'(bez popisu)')}</div>
      ${r.steps ? `<div class="report-steps">📋 Kroky:\n${esc(r.steps)}</div>` : ''}
      ${commentsHtml ? `<div class="comments">${commentsHtml}</div>` : ''}
    </div>`;
  }).join('');
}

async function loadReports() {
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('reports-list').innerHTML = '';
  try {
    const snap = await db.ref('bugReports').orderByChild('timestamp').once('value');
    const data = snap.val() || {};
    allReports = Object.entries(data)
      .map(([id, r]) => ({...r, id}))
      .sort((a,b) => (b.timestamp||0) - (a.timestamp||0));

    const cnt = { new:0, in_progress:0, resolved:0, wont_fix:0 };
    allReports.forEach(r => { const s = r.status||'new'; if(cnt[s]!==undefined) cnt[s]++; });

    document.getElementById('cnt-all').textContent = allReports.length;
    document.getElementById('cnt-new').textContent = cnt.new;
    document.getElementById('cnt-prog').textContent = cnt.in_progress;
    document.getElementById('cnt-done').textContent = cnt.resolved;
    document.getElementById('cnt-skip').textContent = cnt.wont_fix;
    document.getElementById('last-updated').textContent =
      'Aktualizováno: ' + new Date().toLocaleString('cs-CZ') + ' · ' + allReports.length + ' hlášení';

    document.getElementById('loading').classList.add('hidden');
    renderReports();
  } catch(e) {
    document.getElementById('loading').innerHTML = '<span style="color:var(--accent)">❌ Chyba: ' + esc(e.message) + '</span>';
  }
}

loadReports();
</script>
</body>
</html>
