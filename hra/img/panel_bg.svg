<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <!-- Brushed metal grain -->
    <filter id="metal-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.05" numOctaves="5" seed="2" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="gray"/>
      <feComponentTransfer result="metal">
        <feFuncR type="linear" slope="0.12" intercept="0.08"/>
        <feFuncG type="linear" slope="0.11" intercept="0.07"/>
        <feFuncB type="linear" slope="0.09" intercept="0.06"/>
      </feComponentTransfer>
    </filter>
    <!-- Rust spots -->
    <filter id="rust-spots">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="7" result="rust"/>
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.15  0.15 0 0 0 0.06  0 0 0 0 0.02  0 0 0 1 0" result="colored"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0 0 0.15 0.3 0.1 0 0"/>
      </feComponentTransfer>
    </filter>
    <!-- Scratches -->
    <filter id="scratches">
      <feTurbulence type="fractalNoise" baseFrequency="0.5 0.01" numOctaves="3" seed="15"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.18  0 0 0 0 0.12  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0 0 0 0 0.08 0.15 0 0 0"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="panel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="15%" stop-color="#161410"/>
      <stop offset="50%" stop-color="#0e0d0a"/>
      <stop offset="85%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
  </defs>
  <!-- Base gradient -->
  <rect width="400" height="400" fill="url(#panel-grad)"/>
  <!-- Brushed metal texture -->
  <rect width="400" height="400" filter="url(#metal-noise)" opacity="0.9"/>
  <!-- Rust spots -->
  <rect width="400" height="400" filter="url(#rust-spots)"/>
  <!-- Scratches -->
  <rect width="400" height="400" filter="url(#scratches)"/>
  <!-- Edge highlights -->
  <rect x="0" y="0" width="400" height="2" fill="rgba(80,65,40,0.2)"/>
  <rect x="0" y="398" width="400" height="2" fill="rgba(0,0,0,0.4)"/>
</svg>