<svg xmlns="http://www.w3.org/2000/svg" width="300" height="60">
  <defs>
    <filter id="btn-metal">
      <feTurbulence type="fractalNoise" baseFrequency="1.2 0.08" numOctaves="4" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.1" intercept="0.06"/>
        <feFuncG type="linear" slope="0.09" intercept="0.055"/>
        <feFuncB type="linear" slope="0.07" intercept="0.04"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="btn-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#221e16"/>
      <stop offset="15%" stop-color="#1a1610"/>
      <stop offset="50%" stop-color="#100e0a"/>
      <stop offset="85%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1e1a14"/>
    </linearGradient>
  </defs>
  <rect width="300" height="60" fill="url(#btn-g)"/>
  <rect width="300" height="60" filter="url(#btn-metal)" opacity="0.8"/>
  <!-- Top highlight edge -->
  <rect x="0" y="0" width="300" height="1" fill="rgba(90,75,50,0.2)"/>
  <!-- Bottom shadow edge -->
  <rect x="0" y="59" width="300" height="1" fill="rgba(0,0,0,0.4)"/>
</svg>