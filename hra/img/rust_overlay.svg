<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <defs>
    <filter id="rust">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="5" seed="12"/>
      <feColorMatrix type="matrix" values="0.4 0 0 0 0.18  0.2 0 0 0 0.06  0.05 0 0 0 0.02  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0 0.05 0.15 0.25 0.1 0 0 0"/>
      </feComponentTransfer>
    </filter>
    <filter id="drip">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.15" numOctaves="3" seed="20"/>
      <feColorMatrix type="matrix" values="0.3 0 0 0 0.12  0.15 0 0 0 0.04  0 0 0 0 0.01  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0 0 0.1 0.2 0.08 0 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="300" height="300" filter="url(#rust)"/>
  <rect width="300" height="300" filter="url(#drip)"/>
</svg>