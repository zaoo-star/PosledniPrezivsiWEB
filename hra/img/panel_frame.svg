<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="frame-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a28"/>
      <stop offset="50%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="frame-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a2a1a"/>
      <stop offset="50%" stop-color="#251a10"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="frame-bottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="50%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <linearGradient id="frame-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="50%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#0a0a08"/>
    </linearGradient>
    <radialGradient id="bolt">
      <stop offset="0%" stop-color="#5a4a30"/>
      <stop offset="40%" stop-color="#3a2a18"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <filter id="f-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
  </defs>
  <!-- Frame edges -->
  <rect x="0" y="0" width="100" height="5" fill="url(#frame-top)"/>
  <rect x="0" y="95" width="100" height="5" fill="url(#frame-bottom)"/>
  <rect x="0" y="0" width="5" height="100" fill="url(#frame-left)"/>
  <rect x="95" y="0" width="5" height="100" fill="url(#frame-right)"/>
  <!-- Inner bevel highlight -->
  <rect x="5" y="5" width="90" height="1" fill="rgba(80,65,40,0.15)"/>
  <rect x="5" y="5" width="1" height="90" fill="rgba(80,65,40,0.1)"/>
  <!-- Inner bevel shadow -->
  <rect x="5" y="94" width="90" height="1" fill="rgba(0,0,0,0.3)"/>
  <rect x="94" y="5" width="1" height="90" fill="rgba(0,0,0,0.2)"/>
  <!-- Corner bolts -->
  <circle cx="7" cy="7" r="3.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="7" cy="7" r="1.5" fill="#1a1510"/>
  <circle cx="93" cy="7" r="3.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="93" cy="7" r="1.5" fill="#1a1510"/>
  <circle cx="7" cy="93" r="3.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="7" cy="93" r="1.5" fill="#1a1510"/>
  <circle cx="93" cy="93" r="3.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="93" cy="93" r="1.5" fill="#1a1510"/>
  <!-- Mid-edge bolts -->
  <circle cx="50" cy="4" r="2.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="50" cy="4" r="1" fill="#1a1510"/>
  <circle cx="50" cy="96" r="2.5" fill="url(#bolt)" stroke="#1a1510" stroke-width="0.3"/>
  <circle cx="50" cy="96" r="1" fill="#1a1510"/>
  <!-- Noise overlay -->
  <rect width="100" height="100" filter="url(#f-noise)" opacity="0.5"/>
</svg>