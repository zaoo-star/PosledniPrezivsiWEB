<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <defs>
    <filter id="grunge">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.08" intercept="0"/>
        <feFuncG type="linear" slope="0.07" intercept="0"/>
        <feFuncB type="linear" slope="0.05" intercept="0"/>
        <feFuncA type="linear" slope="0.15" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="200" height="200" filter="url(#grunge)"/>
</svg>