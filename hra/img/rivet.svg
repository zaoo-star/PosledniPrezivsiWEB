<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <radialGradient id="rivet-g" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#6a5a40"/>
      <stop offset="30%" stop-color="#4a3a28"/>
      <stop offset="70%" stop-color="#2a2018"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <radialGradient id="rivet-shadow">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>
  <!-- Shadow -->
  <circle cx="10" cy="11" r="7" fill="rgba(0,0,0,0.4)"/>
  <!-- Main rivet body -->
  <circle cx="10" cy="10" r="6" fill="url(#rivet-g)"/>
  <!-- Inner ring -->
  <circle cx="10" cy="10" r="4" fill="none" stroke="#3a2a18" stroke-width="0.5"/>
  <!-- Highlight -->
  <circle cx="8" cy="8" r="2" fill="rgba(120,100,70,0.3)"/>
  <!-- Center dot -->
  <circle cx="10" cy="10" r="1.5" fill="#1a1510"/>
  <circle cx="10" cy="10" r="1" fill="#252015"/>
  <!-- Cross slot -->
  <line x1="8.5" y1="10" x2="11.5" y2="10" stroke="#151010" stroke-width="0.7"/>
  <line x1="10" y1="8.5" x2="10" y2="11.5" stroke="#151010" stroke-width="0.7"/>
</svg>