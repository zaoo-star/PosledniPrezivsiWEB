<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Systém mimo provoz</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #0d0d0d;
        color: #9eff00;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    .container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex-direction: column;
    }

    h1 {
        font-size: 3em;
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: glitch 1s infinite;
    }

    p {
        font-size: 1.2em;
        max-width: 600px;
        opacity: 0.8;
    }

    .warning {
        margin-top: 20px;
        color: #ff3b3b;
        font-weight: bold;
    }

    @keyframes glitch {
        0% { text-shadow: 2px 2px #ff0000; }
        25% { text-shadow: -2px -2px #00ffea; }
        50% { text-shadow: 2px -2px #ff0000; }
        75% { text-shadow: -2px 2px #00ffea; }
        100% { text-shadow: 2px 2px #ff0000; }
    }

    .noise {
        position: fixed;
        width: 100%;
        height: 100%;
        background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        opacity: 0.2;
        pointer-events: none;
    }

    .footer {
        position: absolute;
        bottom: 10px;
        font-size: 0.8em;
        opacity: 0.5;
    }
</style>

</head>
<body>

<div class="noise"></div>

<div class="container">
    <h1>SYSTÉM SELHAL</h1>

    <p>
        Přenos zóny byl přerušen. Servery utrpěly kritické poškození.
        Pracujeme na obnově systému a stabilizaci světa.
    </p>

    <p class="warning">
        Hra je dočasně offline do NEDĚLE.
    </p>

    <p>
        Pokud přežijeme… vrátíme se silnější.
    </p>

    <div class="footer">
        [ STATUS: REPAIR MODE ] | [ SIGNAL LOST... ]
    </div>
</div>

</body>
</html>
